<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kästchen-Wörter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="controls">
        <label for="titleInput">Seiten Überschrift</label>
        <div class="input-row title-row">
          <input id="titleInput" type="text" autocomplete="off" placeholder="Seiten Überschrift eingeben" />
        </div>

        <div class="scale-row">
          <label for="scaleInput">Größe</label>
          <input id="scaleInput" type="range" min="50" max="100" step="1" value="100" />
          <span id="scaleValue">100%</span>
        </div>

        <label for="wordInput">Wort</label>
        <div class="input-row">
          <input id="wordInput" type="text" autocomplete="off" placeholder="Wort eingeben" />
          <button id="addBtn" type="button">Hinzufügen</button>
          <button id="clearBtn" type="button">Alle löschen</button>
          <button id="exportBtn" type="button">PDF exportieren</button>
        </div>
        <div id="wordList" class="word-list"></div>
      </section>

      <section class="preview-wrap">
        <div id="page1" class="page"></div>
        <div id="page2" class="page"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
